<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>KubePort AI | Portable Model Console</title>
		<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="/static/vendor/github-dark.min.css" />
		<script src="/static/vendor/marked.min.js"></script>
		<script src="/static/vendor/purify.min.js"></script>
		<script src="/static/vendor/highlight.min.js"></script>
		<style>
			:root {
				color-scheme: light dark;
				--font-sans: "Rubik", ui-sans-serif, system-ui, sans-serif;
				--font-display: "Space Mono", ui-monospace, monospace;
				--font-mono: "Space Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				--shadow: 0 10px 30px -12px oklch(0.1 0.003 70 / 0.45);

				--bg: light-dark(oklch(0.97 0.004 85), oklch(0.105 0.003 70));
				--fg: light-dark(oklch(0.22 0.01 70), oklch(0.89 0.008 85));
				--fg-strong: light-dark(oklch(0.14 0.01 70), oklch(0.95 0.006 85));
				--muted: light-dark(oklch(0.5 0.01 75), oklch(0.59 0.008 75));
				--card: light-dark(oklch(0.99 0.002 85), oklch(0.13 0.004 70));
				--hover: light-dark(oklch(0.93 0.008 70), oklch(0.2 0.006 70));
				--hover-fg: light-dark(oklch(0.18 0.01 70), oklch(0.95 0.006 85));
				--border: light-dark(oklch(0.86 0.008 70), oklch(0.32 0.006 70));

				--primary: light-dark(oklch(0.6 0.19 45), oklch(0.67 0.2 45));
				--primary-soft: light-dark(oklch(0.6 0.19 45 / 0.1), oklch(0.67 0.2 45 / 0.1));
				--primary-border: light-dark(oklch(0.6 0.19 45 / 0.3), oklch(0.67 0.2 45 / 0.35));

				--composer-bg: light-dark(oklch(0.99 0.002 85), oklch(0.13 0.004 70));
				--composer-border: light-dark(oklch(0.86 0.008 70), oklch(0.32 0.006 70));
				--composer-hover: light-dark(oklch(0.78 0.012 70), oklch(0.4 0.01 70));
				--composer-focus: light-dark(oklch(0.6 0.19 45), oklch(0.67 0.2 45));
				--send-bg: light-dark(oklch(0.6 0.19 45), oklch(0.67 0.2 45));
				--send-fg: light-dark(oklch(0.99 0.004 85), oklch(0.1 0.003 70));
				--send-bg-hover: light-dark(oklch(0.54 0.18 45), oklch(0.74 0.18 45));
				--send-off-bg: light-dark(oklch(0.9 0.006 70), oklch(0.22 0.005 70));
				--send-off-fg: light-dark(oklch(0.62 0.01 70), oklch(0.5 0.01 70));
				--actions: light-dark(oklch(0.5 0.01 75), oklch(0.59 0.008 75));
				--actions-alt: light-dark(oklch(0.35 0.01 70), oklch(0.78 0.008 85));
				--caret: light-dark(oklch(0.6 0.19 45), oklch(0.67 0.2 45));
				--stat: light-dark(oklch(0.45 0.02 75), oklch(0.66 0.02 75));

				--code-bg: light-dark(oklch(0.94 0.006 70), oklch(0.165 0.005 70));
				--code-fg: light-dark(oklch(0.28 0.02 70), oklch(0.9 0.02 85));
				--rule: light-dark(oklch(0.88 0.008 70), oklch(0.32 0.006 70));
				--hr: light-dark(oklch(0.9 0.006 70), oklch(0.28 0.006 70));
				--err-bg: light-dark(oklch(0.95 0.03 25), oklch(0.22 0.05 25));

				--onprem: light-dark(oklch(0.6 0.19 45), oklch(0.67 0.2 45));
				--cloud: light-dark(oklch(0.55 0.16 250), oklch(0.66 0.17 258));
				--ok: light-dark(oklch(0.62 0.14 155), oklch(0.72 0.14 155));
				--bad: light-dark(oklch(0.55 0.22 27), oklch(0.68 0.19 25));

				--infra: light-dark(oklch(0.94 0.006 70), oklch(0.125 0.004 70));
				--infra-elevated: light-dark(oklch(0.97 0.004 70), oklch(0.155 0.005 70));
				--infra-fg: light-dark(oklch(0.22 0.01 70), oklch(0.89 0.008 85));
				--infra-muted: light-dark(oklch(0.5 0.01 75), oklch(0.57 0.009 75));
				--infra-border: light-dark(oklch(0.84 0.01 70), oklch(0.34 0.007 70));
				--infra-active: light-dark(oklch(0.62 0.14 155), oklch(0.72 0.14 155));
				--infra-highlight: light-dark(oklch(0.91 0.01 70), oklch(0.17 0.006 70));
				--infra-glow: light-dark(oklch(0.6 0.19 45), oklch(0.67 0.2 45));
				--rail-w: 340px;
			}

			:root[data-theme='light'] { color-scheme: light; }
			:root[data-theme='dark'] { color-scheme: dark; }

			*, *::before, *::after { box-sizing: border-box; }
			p, h1, h2, h3, ul, ol, dl, dd, dt { margin: 0; }

			html {
				font-family: var(--font-sans);
				font-size: 16px;
				-webkit-font-smoothing: antialiased;
				text-rendering: optimizeLegibility;
			}

			body {
				margin: 0;
				height: 100dvh;
				min-height: 640px;
				overflow: hidden;
				background: var(--bg);
				color: var(--fg);
				display: flex;
				flex-direction: column;
				font-size: 0.875rem;
				line-height: 1.5;
			}

			button {
				cursor: pointer;
				font: inherit;
				color: inherit;
				background: transparent;
				border: 0;
			}

			:focus-visible {
				outline: 2px solid var(--composer-focus);
				outline-offset: 2px;
			}

			@keyframes signal-pulse {
				0%, 100% { opacity: 1; box-shadow: 0 0 0 0 color-mix(in oklab, var(--primary) 35%, transparent); }
				50% { opacity: 0.55; box-shadow: 0 0 0 5px transparent; }
			}
			.signal {
				display: inline-block;
				width: 0.5rem;
				height: 0.5rem;
				border-radius: 999px;
				background: var(--primary);
				animation: signal-pulse 2.4s ease-in-out infinite;
				flex: none;
			}
			.signal.ok { background: var(--infra-active); }
			.signal.bad { background: var(--bad); animation: none; }
			@media (prefers-reduced-motion: reduce) { .signal { animation: none; } }

			#app { flex: 1; min-height: 0; display: flex; flex-direction: column; }

			/* Header — match design: h-16, Space Mono labels */
			.topbar {
				flex: none;
				height: 4rem;
				display: flex;
				align-items: center;
				gap: 0.75rem;
				padding: 0 1rem;
				border-bottom: 1px solid var(--border);
				background: var(--bg);
			}
			@media (min-width: 768px) { .topbar { padding: 0 1.5rem; } }

			.brand { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
			.brand-mark {
				position: relative;
				width: 2.25rem; height: 2.25rem;
				display: grid; place-items: center;
				border: 1px solid var(--primary-border);
				background: var(--primary-soft);
				color: var(--primary);
				flex: none;
			}
			.brand-mark .signal { position: absolute; top: -3px; right: -3px; width: 0.5rem; height: 0.5rem; }
			.brand-mark svg { width: 1.25rem; height: 1.25rem; }
			.brand-copy { display: flex; flex-direction: column; gap: 0.15rem; justify-content: center; }
			.brand-title {
				font-family: var(--font-display);
				font-size: 0.875rem;
				font-weight: 700;
				line-height: 1;
				letter-spacing: 0.02em;
				text-transform: uppercase;
				color: var(--fg-strong);
			}
			.brand-sub {
				font-family: var(--font-display);
				font-size: 8px;
				line-height: 1;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--muted);
			}
			.brand-meta {
				display: none;
				align-items: center;
				gap: 0.5rem;
				font-family: var(--font-display);
				font-size: 9px;
				line-height: 1;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--muted);
			}
			.brand-meta .sep { color: var(--border); }
			@media (min-width: 640px) { .brand-meta { display: flex; } }

			.topbar-end { margin-left: auto; display: flex; align-items: center; gap: 0.75rem; }
			.health-chip {
				display: none;
				align-items: center;
				gap: 0.5rem;
				padding: 0.25rem 0.5rem;
				border: 1px solid var(--primary-border);
				background: var(--primary-soft);
				font-family: var(--font-display);
				font-size: 9px;
				line-height: 1;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--muted);
			}
			@media (min-width: 640px) { .health-chip { display: flex; } }
			.health-chip svg { width: 0.875rem; height: 0.875rem; color: var(--primary); flex: none; }

			.site-live {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				font-family: var(--font-display);
				font-size: 10px;
				font-weight: 700;
				line-height: 1;
				color: var(--fg-strong);
			}
			.site-live .sub {
				font-weight: 400;
				color: var(--muted);
				font-variant-numeric: tabular-nums;
			}
			.site-live .sub.bad { color: var(--bad); }

			.icon-btn {
				display: grid; place-items: center;
				width: 2rem; height: 2rem;
				border: 1px solid var(--border);
				color: var(--actions-alt);
				transition: background 0.15s, color 0.15s, border-color 0.15s;
			}
			.icon-btn:hover { background: var(--hover); color: var(--hover-fg); border-color: var(--composer-hover); }
			.icon-btn svg { width: 1rem; height: 1rem; }
			.rail-toggle-mobile { display: grid; }
			@media (min-width: 1024px) { .rail-toggle-mobile { display: none; } }

			.shell { flex: 1; min-height: 0; display: flex; }

			.main {
				position: relative;
				flex: 1; min-width: 0;
				display: flex; flex-direction: column;
				background-image: linear-gradient(color-mix(in oklab, var(--border) 14%, transparent) 1px, transparent 1px);
				background-size: 100% 64px;
			}
			.main::before {
				content: '';
				position: absolute; inset: 0;
				pointer-events: none;
				background: color-mix(in oklab, var(--bg) 90%, transparent);
			}

			.session-strip {
				position: relative;
				flex: none;
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 1rem;
				padding: 1rem;
				border-bottom: 1px solid var(--border);
			}
			@media (min-width: 768px) { .session-strip { padding: 1rem 2rem; } }
			.session-copy { display: flex; flex-direction: column; min-width: 0; }
			.session-kicker {
				margin-bottom: 0.25rem;
				font-family: var(--font-display);
				font-size: 8px;
				line-height: 1;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--primary);
			}
			.session-title {
				font-family: var(--font-display);
				font-size: 1rem;
				font-weight: 400;
				line-height: 1.2;
				letter-spacing: 0.02em;
				text-transform: uppercase;
				color: var(--fg-strong);
			}
			.session-model {
				margin-top: 0.25rem;
				font-family: var(--font-display);
				font-size: 9px;
				line-height: 1.2;
				color: var(--muted);
			}
			.session-metrics {
				display: none;
				align-items: center;
				gap: 1rem;
				font-family: var(--font-display);
				font-size: 9px;
				line-height: 1;
				color: var(--muted);
				font-variant-numeric: tabular-nums;
			}
			@media (min-width: 768px) { .session-metrics { display: flex; } }
			.session-metrics span { display: flex; align-items: center; gap: 0.375rem; }
			.session-metrics svg { width: 0.875rem; height: 0.875rem; color: var(--primary); flex: none; }

			#scroll {
				position: relative;
				flex: 1; min-height: 0;
				overflow-y: auto; overflow-x: hidden;
			}
			#messages, #placeholder {
				width: 100%;
				max-width: 48rem;
				margin: 0 auto;
				padding: 2rem 1.25rem;
				display: flex;
				flex-direction: column;
				gap: 2rem;
			}
			@media (min-width: 768px) {
				#messages, #placeholder { padding: 2rem; }
			}
			#placeholder[hidden] { display: none; }
			#messages:empty { display: none; }

			.msg { display: flex; flex-direction: column; gap: 0.5rem; width: 100%; max-width: 95%; }
			.msg.user { margin-left: auto; align-items: flex-end; }

			.msg.assistant .name {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				margin-bottom: 0.125rem;
				font-family: var(--font-display);
				font-size: 9px;
				font-weight: 700;
				line-height: 1;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--muted);
			}
			.msg.assistant .name .local { font-weight: 400; color: var(--primary); }
			.avatar {
				width: 1.75rem; height: 1.75rem;
				display: grid; place-items: center;
				border: 1px solid var(--primary-border);
				background: var(--primary-soft);
				color: var(--primary);
				flex: none;
			}
			.avatar svg { width: 0.875rem; height: 0.875rem; }

			.bubble { max-width: 100%; }
			.msg.user .bubble {
				border: 1px solid var(--primary-border);
				background: var(--primary-soft);
				padding: 0.75rem 1rem;
				color: var(--fg);
			}

			.prose {
				font-family: var(--font-sans);
				font-size: 0.875rem;
				font-weight: 400;
				line-height: 1.5;
				color: var(--fg);
			}
			.prose p { margin: 0 0 0.5rem; }
			.prose p:last-child { margin-bottom: 0; }
			.prose ol, .prose ul { margin: 0.5rem 0; padding-left: 1.5em; }
			.prose li { margin: 0.125rem 0; }
			.prose li:has(> input[type='checkbox']) { list-style: none; margin-left: -1.25em; }
			.prose li > input[type='checkbox'] { margin-right: 0.5em; accent-color: var(--primary); }
			.prose :not(pre) > code {
				font-family: var(--font-mono);
				font-size: 0.85em;
				padding: 0.1rem 0.35rem;
				border-radius: 0.25rem;
				background: var(--code-bg);
				color: var(--code-fg);
			}
			.prose pre {
				border: 1px solid var(--rule);
				background: var(--code-bg);
				color: var(--code-fg);
				padding: 1rem;
				overflow-x: auto;
				margin: 0.75rem 0;
			}
			.prose pre code {
				background: none; border: 0; padding: 0;
				font-family: var(--font-mono); font-size: 0.8125rem; white-space: pre;
			}
			.prose table { border-collapse: collapse; display: block; width: max-content; max-width: 100%; overflow-x: auto; font-size: 0.85em; }
			.prose th, .prose td { border-bottom: 1px solid var(--rule); padding: 0.5em 0.75em; text-align: left; }
			.prose thead th {
				font-family: var(--font-display);
				font-size: 0.65rem;
				font-weight: 700;
				text-transform: uppercase;
				color: var(--actions-alt);
			}
			.prose strong { font-weight: 600; }
			.prose h1, .prose h2, .prose h3 {
				margin: 0.75rem 0 0.35rem;
				font-family: var(--font-display);
				font-weight: 700;
				text-transform: uppercase;
				color: var(--fg-strong);
			}
			.prose h1 { font-size: 1.1rem; }
			.prose h2 { font-size: 1rem; }
			.prose h3 { font-size: 0.9rem; }
			.prose blockquote { margin: 0.75rem 0; padding-left: 1em; border-left: 2px solid var(--primary); color: var(--muted); }
			.prose hr { margin: 1rem 0; border: 0; border-top: 1px solid var(--hr); }
			.prose a { color: var(--primary); }
			.prose > :first-child { margin-top: 0; }
			.prose > :last-child { margin-bottom: 0; }

			.caret {
				display: inline-block;
				width: 0.125rem; height: 0.875rem;
				margin-left: 0.125rem;
				background: var(--caret);
				vertical-align: text-bottom;
				animation: signal-pulse 1.4s ease-in-out infinite;
			}
			.actions { display: flex; align-items: center; gap: 0.125rem; color: var(--actions); }
			.act {
				display: grid; place-items: center;
				width: 1.75rem; height: 1.75rem;
				transition: background 0.15s, color 0.15s;
			}
			.act:hover { background: var(--hover); color: var(--fg-strong); }
			.act svg { width: 0.875rem; height: 0.875rem; }
			.stat {
				margin-left: 0.35rem;
				font-family: var(--font-display);
				font-size: 9px;
				line-height: 1;
				color: var(--stat);
				font-variant-numeric: tabular-nums;
			}
			.err {
				display: flex; align-items: flex-start; gap: 0.5rem;
				margin-top: 0.5rem;
				padding: 0.5rem 0.75rem;
				border: 1px solid color-mix(in oklab, var(--bad) 35%, transparent);
				background: var(--err-bg);
				font-size: 0.75rem;
				color: var(--bad);
			}
			.err svg { flex: none; width: 1rem; height: 1rem; margin-top: 0.1rem; }

			/* Dock: suggestions + composer always at bottom */
			#dock {
				position: relative;
				flex: none;
				width: 100%;
				max-width: 48rem;
				margin: 0 auto;
				padding: 0 1rem 1.25rem;
			}
			@media (min-width: 768px) { #dock { padding: 0 2rem 1.25rem; } }

			.sugg-list {
				display: flex;
				gap: 0.5rem;
				overflow-x: auto;
				padding-bottom: 0.75rem;
			}
			.sugg {
				flex: none;
				display: inline-flex;
				align-items: center;
				border: 1px solid var(--border);
				background: transparent;
				padding: 0.4rem 0.7rem;
				font-family: var(--font-display);
				font-size: 9px;
				line-height: 1;
				letter-spacing: 0.02em;
				color: var(--muted);
				transition: background 0.15s, color 0.15s, border-color 0.15s;
			}
			.sugg:hover { background: var(--hover); border-color: var(--composer-hover); color: var(--hover-fg); }
			.sugg b { font-weight: 400; color: inherit; }
			.sugg i { display: none; }

			.composer-wrap { width: 100%; }
			.composer {
				display: flex;
				flex-direction: column;
				border: 1px solid var(--composer-border);
				background: var(--composer-bg);
				transition: border-color 0.15s, box-shadow 0.15s;
			}
			.composer:hover { border-color: var(--composer-hover); }
			.composer:focus-within {
				border-color: var(--composer-focus);
				box-shadow: 0 0 0 3px color-mix(in oklab, var(--composer-focus) 18%, transparent);
			}
			.composer-inner { padding: 0.75rem 0.875rem 0.35rem; }
			#input {
				width: 100%;
				border: 0; outline: none; resize: none;
				background: transparent;
				color: var(--fg);
				caret-color: var(--caret);
				font-family: var(--font-sans);
				font-size: 0.875rem;
				line-height: 1.5;
				min-height: 5rem;
				max-height: 24rem;
				overflow: auto;
			}
			#input::placeholder { color: var(--muted); }
			.composer-bar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 0.75rem;
				padding: 0.35rem 0.75rem 0.75rem;
			}
			.model-chip {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				min-width: 0;
				font-family: var(--font-display);
				font-size: 8px;
				line-height: 1;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--muted);
			}
			.model-chip .dot {
				width: 0.375rem; height: 0.375rem;
				border-radius: 999px;
				background: var(--primary);
				flex: none;
			}
			.model-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
			#send {
				display: grid; place-items: center;
				width: 2rem; height: 2rem;
				background: var(--send-bg);
				color: var(--send-fg);
				transition: background 0.15s;
			}
			#send:hover:not(:disabled) { background: var(--send-bg-hover); }
			#send:disabled { background: var(--send-off-bg); color: var(--send-off-fg); cursor: not-allowed; }
			#send svg { width: 1rem; height: 1rem; }

			/* Rail — exact design type scale */
			.rail {
				display: none;
				flex-direction: column;
				flex: none;
				width: var(--rail-w);
				border-left: 1px solid var(--infra-border);
				background: var(--infra);
				color: var(--infra-fg);
				transition: width 0.25s ease;
			}
			.rail.collapsed { width: 3.5rem; }
			@media (min-width: 1024px) { .rail { display: flex; } }
			.rail-head {

			.serving-title {

			.live-pill {
				display: flex;
				align-items: center;
				gap: 0.375rem;
				margin-left: auto;
				font-family: var(--font-display);
				font-size: 8px;
				line-height: 1;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--infra-active);
				flex: none;
			}
			.live-pill.bad { color: var(--bad); }
			.live-pill .signal { width: 0.375rem; height: 0.375rem; }

			.plat-row, .status-row {
				display: flex;
				align-items: center;
				gap: 1rem;
				padding: 1rem 0;
				border-bottom: 1px solid var(--infra-border);
			}
			.status-row {
				border-bottom: 0;
				gap: 0.75rem;
				padding: 0.65rem 0 0.25rem;
			}
			.plat-row svg.lead, .status-row svg.lead { width: 1.25rem; height: 1.25rem; flex: none; }
			.status-row svg.lead { width: 1rem; height: 1rem; }
			.plat-row .brand-logo {
				width: 2.25rem;
				height: 2.25rem;
				object-fit: contain;
				flex: none;
				border-radius: 0.3rem;
			}
			.plat-row .brand-logo.eks {
				width: 2.15rem;
				height: 2.15rem;
			}
			.plat-row .k8s-logo {
				width: 1.75rem;
				height: 1.75rem;
				object-fit: contain;
				margin-left: auto;
				flex: none;
			}
			.status-row .lead { color: var(--infra-active); }
			.status-row.bad .lead { color: var(--bad); }
			.status-row .row-label { font-size: 7px; letter-spacing: 0.07em; }
			.status-row .row-value {
				margin-top: 0.15rem;
				font-size: 0.65rem;
			}
			.status-row .row-hint {
				margin-top: 0.12rem;
				font-size: 9px;
			}
			.status-row .row-badge { font-size: 7px; }

			.row-copy { min-width: 0; flex: 1; display: flex; flex-direction: column; }
			.row-label {
				font-family: var(--font-display);
				font-size: 8px;
				line-height: 1;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--infra-muted);
			}
			.row-value {
				margin-top: 0.25rem;
				font-family: var(--font-display);
				font-size: 0.75rem;
				line-height: 1.25;
				letter-spacing: 0.02em;
				text-transform: uppercase;
				color: var(--infra-fg);
			}
			.row-value.ok { color: var(--infra-active); }
			.row-value.bad { color: var(--bad); }
			.row-hint {
				margin-top: 0.25rem;
				font-size: 10px;
				line-height: 1.35;
				color: var(--infra-muted);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.row-badge {
				margin-left: auto;
				font-family: var(--font-display);
				font-size: 8px;
				line-height: 1;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--infra-active);
				flex: none;
			}
			.row-badge.bad { color: var(--bad); }

			/* Stats grid — labels 8px, values 11px, left-aligned stack */
			.stats {
				display: grid;
				grid-template-columns: 1fr 1fr;
				column-gap: 1.5rem;
				row-gap: 1.25rem;
			}
			.stat-cell {
				min-width: 0;
				display: flex;
				flex-direction: column;
				align-items: flex-start;
			}
			.stat-cell .lbl {
				font-family: var(--font-display);
				font-size: 8px;
				font-weight: 400;
				line-height: 1;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--infra-muted);
			}
			.stat-cell .val {
				margin-top: 0.25rem;
				font-family: var(--font-display);
				font-size: 11px;
				font-weight: 400;
				line-height: 1.3;
				letter-spacing: 0;
				text-transform: none;
				color: var(--infra-fg);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				max-width: 100%;
			}
			.stat-cell .val.bad { color: var(--bad); }

			.chart {
				margin-top: 1.5rem;
				height: 2.5rem;
				display: flex;
				align-items: flex-end;
				gap: 0.375rem;
				border-bottom: 1px solid var(--infra-border);
			}
			.chart span {
				flex: 1;
				background: color-mix(in oklab, var(--infra-active) 55%, transparent);
				min-height: 10%;
			}
			.chart-meta {
				margin-top: 0.75rem;
				display: flex;
				justify-content: space-between;
				font-family: var(--font-display);
				font-size: 8px;
				line-height: 1;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--infra-muted);
			}
			.chart-meta .tps { color: var(--infra-active); }

			#log {
				margin: 0; padding: 0; list-style: none;
				display: flex; flex-direction: column; gap: 0.75rem;
				max-height: 10rem; overflow-y: auto;
				font-size: 0.75rem;
			}
			#log li { display: flex; gap: 0.75rem; line-height: 1.4; }
			#log time {
				font-family: var(--font-mono);
				font-size: 10px;
				line-height: 1.4;
				color: var(--infra-muted);
				flex: none;
			}
			#log .what { color: var(--infra-fg); }
			#log .lost { color: var(--bad); }
			#log .kept { color: var(--ok); }
			#log .empty { color: var(--infra-muted); font-size: 0.6875rem; }

			.drawer { display: none; position: fixed; inset: 0; z-index: 40; }
			.drawer.open { display: block; }
			@media (min-width: 1024px) { .drawer.open { display: none; } }
			.drawer-backdrop {
				position: absolute; inset: 0;
				background: color-mix(in oklab, var(--bg) 70%, transparent);
				border: 0; width: 100%; height: 100%;
			}
			.drawer-panel {
				position: absolute; top: 0; right: 0;
				display: flex; flex-direction: column;
				width: 85%; max-width: 24rem; height: 100%;
				border-left: 1px solid var(--infra-border);
				background: var(--infra);
				color: var(--infra-fg);
				box-shadow: var(--shadow);
			}

			.mobile-bar {
				display: flex;
				align-items: center;
				justify-content: space-around;
				gap: 0.5rem;
				padding: 0.5rem;
				border-top: 1px solid var(--border);
				background: var(--card);
				font-size: 0.75rem;
				color: var(--muted);
			}
			@media (min-width: 1024px) { .mobile-bar { display: none; } }
			.mobile-bar span { display: flex; align-items: center; gap: 0.5rem; }
			.mobile-bar svg { width: 1rem; height: 1rem; color: var(--primary); }

			.panel { display: contents; }
		</style>
	</head>
	<body>
		<div id="app">
			<header class="topbar">
				<div class="brand">
					<div class="brand-mark" aria-hidden="true">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
							<rect x="9" y="2" width="6" height="6" rx="1" />
							<rect x="2" y="16" width="6" height="6" rx="1" />
							<rect x="16" y="16" width="6" height="6" rx="1" />

						</svg>

							<path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />

					<button type="button" class="icon-btn" id="new-chat" aria-label="New Chat">

					</button>

			<div class="shell">
				<main class="main">
					<div class="session-strip">

								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.5 9 7.5l4 4 8-8" /></svg>

				<div class="rail-body" id="drawer-body"></div>

						<span style="height:54%"></span><span style="height:78%"></span><span style="height:66%"></span>
						<span style="height:82%"></span><span style="height:74%"></span><span style="height:90%"></span>
						<span style="height:71%"></span><span style="height:84%"></span>
					</div>
					<div class="chart-meta"><span>Live throughput</span><span class="tps" id="chart-tps">—</span></div>
				</section>
				<section class="sec">
					<h3>04 — Activity</h3>
					<ul id="log" aria-live="polite"><li class="empty">watching…</li></ul>
				</section>
			</div>
		</template>

		<div class="composer-wrap" id="composer-wrap">
			<div class="composer">
				<div class="composer-inner">
					<textarea id="input" rows="3" aria-label="Message" placeholder="Ask about this model, cluster, or migration path…"></textarea>
				</div>
				<div class="composer-bar">
					<div class="model-chip" aria-hidden="true">
						<span class="dot"></span>
						<span>Running locally · context 8k</span>
					</div>
					<button type="button" id="send" disabled aria-label="Send message">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m9 15-6-6m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" /></svg>
					</button>
				</div>
			</div>
		</div>


		<script>

			const $ = (id) => document.getElementById(id);
			const MARK =
				'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><path stroke-linecap="round" d="M12 8v3M12 11 5 16M12 11l7 5"/></svg>';

			marked.setOptions({ gfm: true, breaks: true });
			const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
			const md = (src) =>
				DOMPurify.sanitize(marked.parse(src ?? ''), {
					SANITIZE_NAMED_PROPS: true,
					FORBID_ATTR: ['style'],
					FORBID_TAGS: ['form', 'button', 'select', 'textarea']
				});

			function highlight(root) {
				root.querySelectorAll('pre code').forEach((code) => {
					const lang = (code.className.match(/language-([\w-]+)/) || [])[1];
					if (lang && hljs.getLanguage(lang)) {
						code.innerHTML = hljs.highlight(code.textContent, {
							language: lang,
							ignoreIllegals: true
						}).value;
					}
					code.parentElement.classList.add('hljs');
				});
			}

			// Mount environment panel into rail + drawer (IDs must exist once for paint).
			const envTpl = $('env-template').content.cloneNode(true);
			$('rail-body').append(envTpl);
			$('drawer-body').append($('env-template').content.cloneNode(true));
			// Keep a single authoritative set of IDs in the rail; mirror text into drawer on paint.
			const drawerMirror = {};
			$('drawer-body')
				.querySelectorAll('[id]')
				.forEach((el) => {
					drawerMirror[el.id] = el;
					el.removeAttribute('id');
				});

			function syncDrawer() {
				Object.entries(drawerMirror).forEach(([id, el]) => {
					const src = document.getElementById(id);
					if (!src) return;
					el.className = src.className;
					if (src.tagName === 'IMG') {
						el.src = src.src;
						el.alt = src.alt;
						el.hidden = src.hidden;
						return;
					}
					el.textContent = src.textContent;
					el.innerHTML = src.innerHTML;
				});
				const chart = $('drawer-body').querySelector('.chart');
				const srcChart = $('throughput');
				if (chart && srcChart) chart.innerHTML = srcChart.innerHTML;
			}

			document.documentElement.dataset.theme ||= 'dark';

			$('theme').onclick = () => {
				const cur = document.documentElement.dataset.theme || 'dark';
				document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
			};

			$('rail-toggle').onclick = () => {
				$('rail').classList.toggle('collapsed');
				const open = !$('rail').classList.contains('collapsed');
				$('rail-toggle').setAttribute(
					'aria-label',
					open ? 'Collapse environment panel' : 'Open environment panel'
				);
			};

			const openDrawer = () => $('drawer').classList.add('open');
			const closeDrawer = () => $('drawer').classList.remove('open');
			$('rail-open').onclick = openDrawer;
			$('drawer-close').onclick = closeDrawer;
			$('drawer-x').onclick = closeDrawer;

			const messages = $('messages');
			const uuid = () =>
				crypto.randomUUID?.() ??
				Date.now().toString(36) + Math.random().toString(36).slice(2);
			let SESSION = uuid();

			function newChat() {
				ctrl?.abort();
				SESSION = uuid();
				messages.innerHTML = '';
				placeComposer();
				$('input').focus();
			}
			$('new-chat').onclick = newChat;

			function placeComposer() {
				const empty = messages.children.length === 0;
				$('placeholder').hidden = !empty;
				$('dock').append($('composer-wrap'));
			}

			function addUser(text) {
				const el = document.createElement('div');
				el.className = 'msg user';
				el.innerHTML = '<div class="bubble"><div class="prose"></div></div>';
				el.querySelector('.prose').textContent = text;
				messages.append(el);
				placeComposer();
				scrollDown();
			}

			function addAssistant() {
				const el = document.createElement('div');
				el.className = 'msg assistant';
				el.innerHTML =
					`<div class="name"><span class="avatar" aria-hidden="true">${MARK}</span>KubePort Assistant <span class="local">/ local</span></div>` +
					'<div class="bubble"><div class="prose"><span class="caret"></span></div></div>' +
					'<div class="actions"></div>';
				messages.append(el);
				scrollDown();
				return el;
			}

			async function restore() {
				let msgs = [];
				try {
					const r = await fetch('/history', {
						method: 'POST',
						headers: { 'content-type': 'application/json' },
						body: JSON.stringify({ session: SESSION }),
						cache: 'no-store',
						signal: AbortSignal.timeout(3000)
					});
					if (!r.ok) throw new Error('HTTP ' + r.status);
					msgs = (await r.json()).messages || [];
				} catch {
					return null;
				}
				messages.innerHTML = '';
				for (const m of msgs) {
					if (m.role === 'user') {
						addUser(m.content);
					} else {
						const el = addAssistant();
						const prose = el.querySelector('.prose');
						prose.innerHTML = md(m.content);
						highlight(prose);
					}
				}
				placeComposer();
				scrollDown();
				return msgs.length;
			}

			function scrollDown() {
				const s = $('scroll');
				s.scrollTop = s.scrollHeight;
			}

			let busy = false;
			let ctrl = null;
			let abortNote = null;
			let linkDownPolls = 0;
			let pollFails = 0;
			let reader = null;

			async function send() {
				abortNote = null;
				const text = $('input').value.trim();
				if (!text || busy) return;
				busy = true;
				$('input').value = '';
				$('input').style.height = 'auto';
				$('send').disabled = true;
				addUser(text);

				const el = addAssistant();
				const prose = el.querySelector('.prose');
				let acc = '';
				let ended = false;
				ctrl = new AbortController();

				try {
					const r = await fetch('/chat', {
						method: 'POST',
						headers: { 'content-type': 'application/json' },
						body: JSON.stringify({ session: SESSION, message: text }),
						signal: ctrl.signal
					});
					if (!r.ok) throw new Error(`HTTP ${r.status}`);

					reader = r.body.getReader();
					const dec = new TextDecoder();
					let buf = '';

					while (true) {
						const { value, done } = await reader.read();
						if (done) break;
						buf += dec.decode(value, { stream: true });
						const parts = buf.split('\n\n');
						buf = parts.pop();

						for (const part of parts) {
							if (!part.startsWith('data: ')) continue;
							let frame;
							try {
								frame = JSON.parse(part.slice(6));
							} catch {
								continue;
							}

							if (frame.done) {
								ended = true;
								prose.innerHTML = md(acc);
								highlight(prose);
								const bits = [];
								const ttft = Number(frame.ttft_ms);
								const rate = Number(frame.tok_per_s);
								if (Number.isFinite(ttft)) bits.push(`${ttft} ms to first token`);
								if (Number.isFinite(rate)) bits.push(`${rate} tok/s`);
								el.querySelector('.actions').innerHTML =
									'<button type="button" class="act" title="Copy" aria-label="Copy">' +
									'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">' +
									'<path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184"/></svg>' +
									`</button><span class="stat">${bits.join(' · ')}</span>`;
								el.querySelector('.act').onclick = () =>
									navigator.clipboard?.writeText(acc).catch(() => {});
							} else if (frame.error) {
								ended = true;
								prose.innerHTML =
									md(acc) +
									'<span class="err">' +
									'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">' +
									'<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>' +
									`<span>${esc(frame.error)}${frame.detail ? ` (${esc(frame.detail)})` : ''}</span></span>`;
							} else if (frame.token !== undefined) {
								acc += frame.token;
								prose.innerHTML = md(acc) + '<span class="caret"></span>';
								scrollDown();
							}
						}
					}
					if (!ended) {
						prose.innerHTML = md(acc) + '<span class="err">stream ended early</span>';
					}
				} catch (e) {
					const why = e.name === 'AbortError' ? abortNote || 'answer stopped' : String(e);
					prose.innerHTML = md(acc) + `<span class="err">${esc(why)}</span>`;
				} finally {
					reader?.cancel().catch(() => {});
					abortNote = null;
					ctrl = null;
					prose.querySelector('.caret')?.remove();
					busy = false;
					$('send').disabled = !$('input').value.trim();
					$('input').focus();
				}
			}

			$('send').onclick = send;
			$('input').addEventListener('input', (e) => {
				$('send').disabled = !e.target.value.trim() || busy;
				e.target.style.height = 'auto';
				e.target.style.height = Math.min(e.target.scrollHeight, 384) + 'px';
			});
			$('input').addEventListener('keydown', (e) => {
				if (e.key === 'Enter' && !e.shiftKey) {
					e.preventDefault();
					send();
				}
			});
			document.querySelectorAll('.sugg').forEach((b) => {
				b.onclick = () => {
					$('input').value = b.dataset.p;
					$('input').dispatchEvent(new Event('input'));
					send();
				};
			});

			let polling = false;
			const state = { instance: null, site: null, model: null, lastOk: null, down: false };

			const fmtUptime = (s) => {
				if (s == null) return '—';
				if (s < 60) return `${Math.floor(s)}s`;
				const m = Math.floor(s / 60);
				return m < 60 ? `${m}m ${Math.floor(s % 60)}s` : `${Math.floor(m / 60)}h ${m % 60}m`;
			};

			function logRow(what, sub, cls) {
				const ul = $('log');
				ul.querySelector('.empty')?.remove();
				const li = document.createElement('li');
				const t = new Date().toTimeString().slice(0, 8);
				li.innerHTML = `<time>${t}</time><div><span class="what"></span></div>`;
				li.querySelector('.what').textContent = what;
				if (sub) {
					const d = document.createElement('div');
					d.className = cls || 'lost';
					d.textContent = sub;
					li.querySelector('div').append(d);
				}
				ul.prepend(li);
				syncDrawer();
			}

			function pushThroughput(rate) {
				const chart = $('throughput');
				if (!chart || rate == null) return;
				const bars = [...chart.children];
				const h = Math.max(12, Math.min(95, Math.round((rate / 40) * 100)));
				bars.shift()?.remove();
				const span = document.createElement('span');
				span.style.height = h + '%';
				chart.append(span);
			}

			function paint(d) {
				const linkDown = !!d.link.error;
				const plat = String(d.platform || '').toLowerCase();
				const awsCloud = plat === 'rosa' || plat === 'eks';
				const eks = plat === 'eks';

				$('hud-site').textContent = d.site_title || d.site;
				$('hud-dot').className = 'signal' + (linkDown ? ' bad' : '');
				$('site-signal').className = 'signal' + (linkDown ? ' bad' : ' ok');
				$('hud-sub').textContent = linkDown
					? 'link down'
					: d.link.rtt_ms != null
						? `${d.link.rtt_ms} ms`
						: '';
				$('hud-sub').className = 'sub' + (linkDown ? ' bad' : '');
				$('chip-name').textContent = d.model;
				$('metric-rtt').textContent =
					d.link.rtt_ms != null ? `${d.link.rtt_ms} ms` : '—';
				$('metric-tps').textContent =
					d.link.tok_per_s != null ? `${d.link.tok_per_s} tok/s` : '—';

				$('health-label').textContent = linkDown ? 'Link degraded' : 'System healthy';
				$('f-site').textContent = d.site_title || d.site || '—';
				$('f-site').className = 'serving-title ' + (plat || 'onprem');
				$('f-platform').textContent = d.platform || '—';
				$('f-plat-label').textContent =
					d.platform_label ||
					(eks ? 'EKS' : plat === 'rosa' ? 'ROSA' : 'On-prem OCP');
				$('f-plat-hint').textContent = eks
					? 'Amazon EKS'
					: plat === 'rosa'
						? 'Red Hat OpenShift on AWS'
						: 'Self-managed OpenShift';
				const awsLogo = $('f-aws-logo');
				awsLogo.hidden = !awsCloud;
				const brand = $('f-brand-logo');
				if (eks) {
					brand.src = '/static/img/eks.png';
					brand.alt = 'EKS';
					brand.className = 'brand-logo eks';
				} else {
					brand.src = '/static/img/openshift.png';
					brand.alt = 'OpenShift';
					brand.className = 'brand-logo';
				}
				$('live-pill').className = 'live-pill' + (linkDown ? ' bad' : '');
				$('live-pill').innerHTML =
					`<span class="signal ${linkDown ? 'bad' : 'ok'}"></span>` +
					(linkDown ? 'Down' : 'Live');

				$('status-row').className = 'status-row' + (linkDown || state.down ? ' bad' : '');
				$('f-app-status').textContent = linkDown || state.down ? 'Degraded' : 'Healthy';
				$('f-app-status').className = 'row-value ' + (linkDown || state.down ? 'bad' : 'ok');
				$('f-app-hint').textContent = linkDown
					? 'Model link not answering'
					: 'All readiness checks passed';
				$('f-app-code').textContent = linkDown || state.down ? 'ERR' : 'OK / 200';
				$('f-app-code').className = 'row-badge' + (linkDown || state.down ? ' bad' : '');

				$('f-region').textContent = d.region;
				$('f-zone').textContent = d.zone || '—';
				$('f-node').textContent = d.node;
				$('f-pod').textContent = d.pod;
				$('f-podip').textContent = d.pod_ip;
				$('f-namespace').textContent = d.namespace || '—';
				$('f-instance').textContent = d.instance_id;
				$('f-uptime').textContent = fmtUptime(d.uptime_s);
				$('f-sessions').textContent =
					d.session_store === 'memory' ? 'in this process' : 'shared store';

				$('f-model').textContent = d.model;
				let host = d.model_url;
				try {
					host = new URL(d.model_url).host;
				} catch {}
				$('f-mhost').textContent = host;
				$('f-mip').textContent = d.link.model_ip || '—';
				$('f-rtt').textContent = linkDown
					? d.link.error
					: d.link.rtt_ms != null
						? `${d.link.rtt_ms} ms`
						: '—';
				$('f-rtt').className = 'val' + (linkDown ? ' bad' : '');
				$('f-ttft').textContent = d.link.ttft_ms != null ? `${d.link.ttft_ms} ms` : '—';
				$('f-tps').textContent =
					d.link.tok_per_s != null ? `${d.link.tok_per_s} tok/s` : '—';
				$('chart-tps').textContent =
					d.link.tok_per_s != null ? `${d.link.tok_per_s} tok/s` : '—';
				if (d.link.tok_per_s != null) pushThroughput(d.link.tok_per_s);

				$('bar-platform').textContent = d.platform;
				$('bar-podip').textContent = d.pod_ip;
				$('bar-region').textContent = d.region;
				syncDrawer();
			}

			async function poll() {
				if (polling) return;
				polling = true;
				let d;
				try {
					const r = await fetch('/whereami', {
						cache: 'no-store',
						signal: AbortSignal.timeout(2500)
					});
					if (!r.ok) throw new Error('HTTP ' + r.status);
					d = await r.json();
					if (!d.instance_id) throw new Error('no instance_id');
					if (!d.link || typeof d.link !== 'object') throw new Error('no link');
				} catch {
					pollFails += 1;
					if (pollFails >= 2 && !state.down) {
						state.down = true;
						if (busy) abortNote = 'lost contact with the app';
						ctrl?.abort();
						$('hud-dot').className = 'signal bad';
						$('site-signal').className = 'signal bad';
						$('hud-site').textContent = 'reconnecting…';
						$('health-label').textContent = 'Reconnecting';
						logRow(state.instance ? 'lost contact with the app' : 'app not reachable');
					}
					polling = false;
					return;
				}

				try {
					if (state.instance && d.instance_id !== state.instance) {
						const seen = (Date.now() - state.lastOk) / 1000;
						const gap = Math.max(0, seen - (d.uptime_s ?? 0)).toFixed(1);
						const had = messages.children.length;
						const from = state.site;
						ctrl?.abort();
						if (d.session_store === 'memory') {
							logRow(
								`${from} → ${d.site} · outage ${gap}s`,
								had ? `conversation lost: ${had} messages` : null
							);
							if (had) {
								messages.innerHTML = '';
								placeComposer();
							}
						} else {
							restore().then((n) => {
								const move = `${from} → ${d.site} · outage ${gap}s`;
								if (n === null) {
									logRow(move, had ? `store unreachable: ${had} messages may be stale` : null);
								} else if (n) {
									logRow(move, `conversation preserved: ${n} messages`, 'kept');
								} else {
									logRow(move, had ? `store had nothing: ${had} messages cleared` : null);
								}
							});
						}
					} else if (state.down) {
						logRow(state.instance ? 'reconnected · same process' : 'connected');
					}

					state.instance = d.instance_id;
					state.site = d.site;
					state.model = d.model;
					state.lastOk = Date.now();
					state.down = false;
					pollFails = 0;
					paint(d);

					linkDownPolls = d.link.error ? linkDownPolls + 1 : 0;
					if (linkDownPolls >= 2 && busy) {
						abortNote = 'model unreachable (' + d.link.error + ')';
						ctrl?.abort();
					}
				} catch {
					state.down = true;
					$('hud-dot').className = 'signal bad';
				} finally {
					polling = false;
				}
			}

			placeComposer();
			poll();
			setInterval(poll, 1000);
		
		</script>
	</body>
</html>
