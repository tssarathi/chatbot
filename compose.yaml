name: chatbot

# Local Mac: `docker compose up --build`
# Builds the host arch only. Multi-arch images: `docker buildx bake` (docker-bake.hcl).

x-site: &site
  build: .
  image: chatbot-site
  depends_on:
    model: {condition: service_healthy}
    sessions: {condition: service_healthy}
  ports: ["127.0.0.1:8200:8000"]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
    interval: 5s
    timeout: 2s
    retries: 3
    start_period: 3s

x-site-env: &site-env
  OLLAMA_URL: http://model:11434
  MODEL_NAME: granite4.1:8b
  SESSION_STORE: ${SESSION_STORE:-memory}
  REDIS_URL: redis://sessions:6379

services:
  sessions:
    image: redis:7-alpine
    networks: [onprem, cloud]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 3

  model:
    build: ./model
    image: chatbot-model
    networks: [onprem, cloud]
    ports: ["127.0.0.1:11434:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # One published port, so every site is gated behind its own profile.
  # `docker compose up -d onprem` enables the profile by naming the service.
  onprem:
    <<: *site
    profiles: [onprem]
    environment:
      <<: *site-env
      SITE: on-prem-mel
      PLATFORM: onprem
      REGION: au-southeast
      NODE_NAME: r740-worker-02
      POD_NAME: chat-onprem
    networks: [onprem]

  rosa:
    <<: *site
    profiles: [rosa]
    environment:
      <<: *site-env
      SITE: rosa-syd
      PLATFORM: rosa
      REGION: ap-southeast-2
      NODE_NAME: rosa-worker-a
      POD_NAME: chat-rosa
    networks: [cloud]

  eks:
    <<: *site
    profiles: [eks, cloud]
    environment:
      <<: *site-env
      SITE: eks-syd
      PLATFORM: eks
      REGION: ap-southeast-2
      NODE_NAME: eks-node-1a
      POD_NAME: chat-eks
    networks: [cloud]

networks:
  onprem:
    ipam:
      config: [{subnet: 10.20.0.0/24}]
  cloud:
    ipam:
      config: [{subnet: 10.30.0.0/24}]
