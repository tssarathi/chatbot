name: chatbot

x-site: &site
  build: .
  depends_on: [modellink]
  ports: ["8200:8000"]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/whereami')"]
    interval: 5s
    timeout: 2s
    retries: 3
    start_period: 3s

x-site-env: &site-env
  OLLAMA_URL: http://modellink:11434
  MODEL_NAME: granite3.1-moe:1b

services:
  modellink:
    image: alpine/socat:latest
    command: TCP-LISTEN:11434,fork,reuseaddr TCP:host.docker.internal:11434
    networks: [onprem, cloud]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  onprem:
    <<: *site
    profiles: [onprem]
    environment:
      <<: *site-env
      SITE: on-prem-mel
      PLATFORM: on-prem
      REGION: au-southeast
      NODE_NAME: r740-worker-02
      POD_NAME: chat-onprem
    networks: [onprem]

  cloud:
    <<: *site
    profiles: [cloud]
    environment:
      <<: *site-env
      SITE: cloud-syd
      PLATFORM: cloud
      REGION: ap-southeast-2
      NODE_NAME: pool-3-a9kq
      POD_NAME: chat-cloud
    networks: [cloud]

networks:
  onprem:
    ipam:
      config: [{subnet: 10.20.0.0/24}]
  cloud:
    ipam:
      config: [{subnet: 10.30.0.0/24}]
