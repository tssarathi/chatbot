name: chatbot

x-site: &site
  build: .
  image: chatbot-site
  depends_on: [modellink, sessions]
  ports: ["127.0.0.1:8200:8000"]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
    interval: 5s
    timeout: 2s
    retries: 3
    start_period: 3s

x-site-env: &site-env
  OLLAMA_URL: http://modellink:11434
  MODEL_NAME: granite3.1-moe:1b
  SESSION_STORE: ${SESSION_STORE:-memory}
  REDIS_URL: redis://sessions:6379

services:
  sessions:
    image: redis:7-alpine
    networks: [onprem, cloud]

  modellink:
    image: nginx:alpine
    networks: [onprem, cloud]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    configs:
      - source: modellink
        target: /etc/nginx/conf.d/default.conf

  onprem:
    <<: *site
    profiles: [onprem]
    environment:
      <<: *site-env
      SITE: on-prem-mel
      PLATFORM: on-prem
      REGION: au-southeast
      NODE_NAME: r740-worker-02
      POD_NAME: chat-onprem
    networks: [onprem]

  cloud:
    <<: *site
    profiles: [cloud]
    environment:
      <<: *site-env
      SITE: cloud-syd
      PLATFORM: cloud
      REGION: ap-southeast-2
      NODE_NAME: pool-3-a9kq
      POD_NAME: chat-cloud
    networks: [cloud]

networks:
  onprem:
    ipam:
      config: [{subnet: 10.20.0.0/24}]
  cloud:
    ipam:
      config: [{subnet: 10.30.0.0/24}]

configs:
  modellink:
    content: |
      server {
        listen 11434;
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $$ollama http://host.docker.internal:11434;
        location / {
          proxy_pass $$ollama$$request_uri;
          proxy_set_header Host localhost:11434;
          proxy_buffering off;
          proxy_request_buffering off;
          proxy_read_timeout 300s;
        }
      }
