# Two sites, one published port, one model.
#
# The two site services claim the same host port on purpose: only one runs at a
# time, and swapping which one is running IS the move. The browser URL never
# changes, the container's IP and subnet genuinely do, and the gap between the
# two commands is the outage the panel measures.
#
#   start on-prem   docker compose --profile onprem up -d --build
#   move to cloud   docker compose stop onprem && docker compose --profile cloud up -d
#   cut the link    docker compose pause modellink
#   restore         docker compose unpause modellink
#   move back       docker compose stop cloud && docker compose --profile onprem up -d
#
# Then open http://localhost:8200/ and leave it open across all of it.

name: chatbot

x-site: &site
  build: .
  depends_on: [modellink]
  ports: ["8200:8000"]
  healthcheck:
    # no curl in python:slim, and /whereami costs nothing (no model call)
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/whereami')"]
    interval: 5s
    timeout: 2s
    retries: 3
    start_period: 3s

x-site-env: &site-env
  OLLAMA_URL: http://modellink:11434
  MODEL_NAME: granite3.1-moe:1b

services:
  # A plain TCP relay to Ollama running on the host.
  #
  # Ollama stays on the host deliberately: a containerised one gets no Metal GPU
  # on macOS and first-token time goes from ~50ms to seconds, which would make
  # the latency numbers on the panel meaningless.
  #
  # The relay exists so the model link is a real network hop we can cut.
  # `pause` freezes the process, so packets are dropped rather than refused —
  # which is what a pulled cable does, and what the app's 3s connect timeout
  # was added to survive. Killing it instead would give an instant connection
  # refused and would not exercise the same path.
  modellink:
    image: alpine/socat:latest
    command: TCP-LISTEN:11434,fork,reuseaddr TCP:host.docker.internal:11434
    networks: [onprem, cloud]
    extra_hosts:
      # Docker Desktop provides this already; the mapping makes it work on Linux too
      - "host.docker.internal:host-gateway"

  onprem:
    <<: *site
    profiles: [onprem]
    environment:
      <<: *site-env
      SITE: on-prem-mel
      PLATFORM: on-prem
      REGION: au-southeast
      NODE_NAME: r740-worker-02
      POD_NAME: chat-onprem
    networks: [onprem]

  cloud:
    <<: *site
    profiles: [cloud]
    environment:
      <<: *site-env
      SITE: cloud-syd
      PLATFORM: cloud
      REGION: ap-southeast-2
      NODE_NAME: pool-3-a9kq
      POD_NAME: chat-cloud
    networks: [cloud]

# Distinct subnets so the pod ip on the panel actually changes across the move,
# and so "10.20" vs "10.30" is visible to anyone reading the screen.
networks:
  onprem:
    ipam:
      config: [{subnet: 10.20.0.0/24}]
  cloud:
    ipam:
      config: [{subnet: 10.30.0.0/24}]
