apiVersion: v1
kind: ServiceAccount
metadata:
  name: chatbot
  namespace: chatbot
  labels:
    app.kubernetes.io/name: chatbot
---
# Nodes are cluster-scoped; pods stay namespaced.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chatbot-whereami
  labels:
    app.kubernetes.io/name: chatbot
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chatbot-whereami
  labels:
    app.kubernetes.io/name: chatbot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chatbot-whereami
subjects:
  - kind: ServiceAccount
    name: chatbot
    namespace: chatbot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chatbot-whereami
  namespace: chatbot
  labels:
    app.kubernetes.io/name: chatbot
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chatbot-whereami
  namespace: chatbot
  labels:
    app.kubernetes.io/name: chatbot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chatbot-whereami
subjects:
  - kind: ServiceAccount
    name: chatbot
    namespace: chatbot
