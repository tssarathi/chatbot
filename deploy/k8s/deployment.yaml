apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  namespace: chatbot
  labels:
    app: chatbot
    app.kubernetes.io/name: chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: chatbot
        app.kubernetes.io/name: chatbot
    spec:
      serviceAccountName: chatbot
      containers:
        - name: chatbot
          image: 10.101.191.154:5000/chatbot-site:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8000
          env:
            # Leave PLATFORM unset to auto-detect from node labels / providerID.
            # Set to onprem | rosa | eks to force a flavour.
            - name: OLLAMA_URL
              value: "http://chatbot-model:11434"
            - name: MODEL_NAME
              value: granite4.1:8b
            - name: SESSION_STORE
              value: memory
            # Downward API — live pod / node facts for Environment intelligence.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
